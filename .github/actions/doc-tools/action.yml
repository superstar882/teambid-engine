# TinyTeX (a small, real TeX Live: the same pdfLaTeX engine Overleaf uses) so members' own LaTeX resumes can be read
# at upload and rebuilt for each job. The install is cached between runs; a package a resume needs that isn't in the
# list below is installed by style_tex.compile_tex on first use. With `libreoffice: "true"`, LibreOffice too, for Word
# members' own .docx. Both run inside a Docker sandbox, armed by the first step below so a later failure (tlmgr,
# docker pull) can't leave it off.
name: Document tools
description: TinyTeX for building members' own LaTeX resumes, LibreOffice for their Word ones
inputs:
  libreoffice:
    description: "Install LibreOffice too (Word members' .docx): only where documents are built or tested"
    default: "false"
runs:
  using: composite
  steps:
    - name: LaTeX sandbox
      shell: bash
      run: |
        # armed FIRST, before any step that can fail (tlmgr update, docker pull): if this action stops early,
        # style_tex must still see the sandbox on rather than silently building a member's upload on the bare runner
        echo "TEAMBID_LATEX_SANDBOX=docker" >> "$GITHUB_ENV"
        echo "TEAMBID_DOCX_SANDBOX=docker" >> "$GITHUB_ENV"     # LibreOffice opens a member's .docx only in Docker too

    - name: Fonts for members' own PDFs
      shell: bash
      run: |
        # a reworded bullet in a member's PDF is drawn in the PDF's own font when possible, else in this family or its
        # metric-compatible stand-in (Calibri -> Carlito, Arial/Helvetica -> Liberation Sans, ...); DejaVu covers ≈ → €.
        # Best-effort: a failed apt update (a mirror down) mustn't stop the action, LaTeX and the documents still build
        { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito fonts-crosextra-caladea \
            fonts-liberation fonts-roboto fonts-inter fonts-open-sans fonts-lato fonts-dejavu-core; } \
          || echo "fonts didn't install this run; reworded bullets fall back to DejaVu Sans"

    - name: LibreOffice for members' own Word resumes
      if: inputs.libreoffice == 'true'
      shell: bash
      run: |
        # style_docx converts a member's tailored .docx to PDF with it, inside Docker (no network). Best-effort: without
        # it a Word member gets the RenderCV resume, with a note
        sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui \
          || echo "LibreOffice didn't install this run; Word members get the RenderCV resume"

    - name: Pre-pull the LibreOffice sandbox image
      if: inputs.libreoffice == 'true'
      shell: bash
      run: |
        # the tag style_docx._image picks: Ubuntu at the runner's own version, since the container runs the runner's
        # /usr (24.04 when that can't be read). Best-effort, like the LaTeX image: `docker run` pulls it if it's missing
        tag=24.04
        if . /etc/os-release && [ "${ID:-}" = ubuntu ] && [[ "${VERSION_ID:-}" =~ ^[0-9]+\.[0-9]+$ ]]; then
          tag="$VERSION_ID"
        fi
        docker pull -q "ubuntu:$tag" || echo "image pull failed; the first Word build pulls it"

    - name: This month
      id: month
      shell: bash
      run: echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Restore TinyTeX
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.TinyTeX
        # a fresh install at most once a month: tlmgr install fails against an old cached TeX Live after its yearly release
        key: tinytex-${{ runner.os }}-${{ steps.month.outputs.ym }}-v2

    - name: Install TinyTeX
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL "https://yihui.org/tinytex/install-bin-unix.sh" | sh

    - name: Put LaTeX on the PATH
      shell: bash
      run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

    - name: LaTeX packages for members' resumes
      shell: bash
      run: |
        # the installer's tlmgr can be older than the package repository, and then it refuses to install anything
        "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" update --self
        "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" install fontawesome fontawesome5 sectsty enumitem helvetic titlesec marvosym preprint babel-english fancyhdr

    - name: Pre-pull the LaTeX sandbox image
      shell: bash
      run: |
        # best-effort: `docker run` (style_tex._latex_cmd) pulls the image itself if it's missing, so a Docker Hub
        # rate limit here just slows the first build instead of failing the whole action
        docker pull -q ubuntu:24.04 || echo "image pull failed; the first build pulls it"
