<style>
/* brand = the logo's indigo (#10014B); everything else is a tint of it */
:root { --brand:#10014b; --brand-text:#10014b; --brand-hover:#2a1a70; --brand-soft:#f3f1fb; --brand-tint:#e7e3f7; --brand-line:#dcd7f0;
        --bg:#fbfbfe; --card:#fff; --ink:#17142b; --muted:#6b6782; --line:#ebe8f4; --on-brand:#fff;
        --go:#12805a; --go2:#e3f6ed; --warn:#a35a00; --warn2:#fff2df; --bad:#b42318; --bad2:#fdebea;
        --shadow:0 1px 2px rgba(16,1,75,.05), 0 6px 20px rgba(16,1,75,.06); --logo-filter:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
        --brand:#5c4be0; --brand-text:#c8c0ff; --brand-hover:#6e5ff0; --brand-soft:#141127; --brand-tint:#241f47; --brand-line:#302a57;
        --bg:#0e0c1b; --card:#18152c; --ink:#ecebf6; --muted:#a39fbd; --line:#2a2646; --on-brand:#fff;
        --go:#4cc38a; --go2:#122a1f; --warn:#f0a83e; --warn2:#2b2111; --bad:#ff7a6e; --bad2:#2d1614;
        --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --logo-filter:brightness(0) invert(1); } }
:root[data-theme="dark"] { --brand:#5c4be0; --brand-text:#c8c0ff; --brand-hover:#6e5ff0; --brand-soft:#141127; --brand-tint:#241f47;
        --brand-line:#302a57; --bg:#0e0c1b; --card:#18152c; --ink:#ecebf6; --muted:#a39fbd; --line:#2a2646;
        --go:#4cc38a; --go2:#122a1f; --warn:#f0a83e; --warn2:#2b2111; --bad:#ff7a6e; --bad2:#2d1614; --logo-filter:brightness(0) invert(1); }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:14px/1.5 Nunito, ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
a { color:var(--brand-text); font-weight:600; text-decoration:none; } a:hover { text-decoration:underline; }
.muted { color:var(--muted); } .bad { color:var(--bad); } .hide { display:none !important; }
.logo { height:34px; width:auto; display:block; filter:var(--logo-filter); }

/* lock screen */
.lock { max-width:400px; margin:14vh auto 0; padding:32px 28px; background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); text-align:center; }
.lock .logo { height:48px; margin:0 auto 14px; }
.lock form { margin-top:14px; } .lock label { display:inline-flex; gap:6px; align-items:center; margin-top:12px; }

/* app shell: sidebar + main */
.shell { display:grid; grid-template-columns:268px 1fr; min-height:100vh; }
.side { background:var(--brand-soft); border-right:1px solid var(--brand-line); padding:20px 14px; display:flex; flex-direction:column; gap:6px;
        position:sticky; top:0; height:100vh; overflow-y:auto; }
.side .brandrow { display:flex; align-items:center; gap:10px; padding:4px 10px 14px; }
.side .brandrow small { color:var(--muted); font-weight:700; letter-spacing:.02em; }
.side-label { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:12px 12px 4px; }
.navlist { display:flex; flex-direction:column; gap:2px; }
.navitem { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:var(--ink); font:inherit; font-weight:600;
           padding:8px 10px; border-radius:14px; cursor:pointer; text-align:left; transition:background .15s, color .15s; }
.navitem:hover { background:var(--brand-tint); }
.navitem.on { background:var(--card); color:var(--brand-text); box-shadow:var(--shadow); }
.navitem svg { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.85; }
.av { width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800;
      background:var(--brand-tint); color:var(--brand-text); }
.navitem.on .av { background:var(--brand); color:var(--on-brand); }
.navitem .nm { display:flex; flex-direction:column; min-width:0; line-height:1.25; }
.navitem .nm b { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.navitem .nm small { color:var(--muted); font-weight:600; font-size:12px; }
.count { margin-left:auto; font-size:12px; font-weight:800; background:var(--brand-tint); color:var(--brand-text); border-radius:999px; padding:1px 9px; }
.navitem.on .count { background:var(--brand); color:var(--on-brand); }
.side-foot { margin-top:auto; padding:14px 10px 0; display:flex; flex-direction:column; gap:10px; font-size:12px; }
main.main { min-width:0; padding:26px 32px 40px; }
.topbar { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.topbar h1 { font-size:26px; font-weight:800; margin:0; letter-spacing:-.01em; }
.topbar .sub { color:var(--muted); font-weight:600; }
.iconbtn { display:none; border:1px solid var(--line); background:var(--card); color:var(--ink); width:40px; height:40px; border-radius:12px; cursor:pointer; }
.iconbtn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
.scrim { display:none; }

/* cards, controls */
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
.card h2 { font-size:16px; font-weight:800; margin:0 0 12px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
input, select, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; outline:none;
                          transition:border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color:var(--brand-text); box-shadow:0 0 0 3px var(--brand-tint); }
textarea { resize:vertical; line-height:1.5; }
button.b, button.b2 { font:inherit; font-weight:700; border-radius:999px; padding:8px 18px; cursor:pointer; transition:background .15s, transform .05s; }
button.b { background:var(--brand); border:1px solid var(--brand); color:var(--on-brand); }
button.b:hover { background:var(--brand-hover); } button.b:active, button.b2:active { transform:translateY(1px); }
button.b2 { background:var(--card); border:1px solid var(--line); color:var(--ink); padding:6px 14px; }
button.b2:hover { background:var(--brand-soft); border-color:var(--brand-line); }
button:disabled { opacity:.6; cursor:wait; }
.prog { display:grid; grid-template-columns:1fr auto; gap:6px; width:210px; }
.prog select, .prog input, .prog button { height:34px; padding:4px 10px; margin:0; width:100%; }
.prog .pnote, .prog .who { grid-column:1 / -1; }
.prog .who { font-size:11px; margin-top:-2px; }
td.nw { white-space:nowrap; }
.doc { border-top:1px solid var(--line); padding:14px 0; } .doc:first-child { border-top:0; padding-top:0; }
table { border-collapse:separate; border-spacing:0; width:100%; }
th, td { text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:var(--brand-soft); }
th { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:800; background:var(--brand-tint); color:var(--brand-text); }
.best { background:var(--go2); color:var(--go); } .consider { background:var(--warn2); color:var(--warn); }
.ready { background:var(--go2); color:var(--go); } .wait { background:var(--warn2); color:var(--warn); } .fail { background:var(--bad2); color:var(--bad); }
.big { font-size:30px; font-weight:800; }
details summary { cursor:pointer; }

@media (max-width:900px) {
  .shell { grid-template-columns:1fr; }
  .side { position:fixed; inset:0 auto 0 0; width:280px; z-index:20; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); }
  .shell.open .side { transform:none; }
  .shell.open .scrim { display:block; position:fixed; inset:0; background:rgba(16,1,75,.25); z-index:10; }
  .iconbtn { display:grid; place-items:center; }
  main.main { padding:16px; }
  .topbar h1 { font-size:21px; }
}
@media (max-width:700px) { .m-hide { display:none; } .card { padding:14px; border-radius:16px; } }

/* local app only */
.b.ghost { background:var(--card); color:var(--ink); border-color:var(--line); }
.b.ghost:hover { background:var(--brand-soft); border-color:var(--brand-line); }
button.b { font:inherit; font-weight:700; border-radius:999px; padding:8px 18px; cursor:pointer; }
textarea { width:100%; }
.GO { background:var(--go2); color:var(--go); } .CAUTION { background:var(--warn2); color:var(--warn); } .SKIP { background:var(--bad2); color:var(--bad); }
.kv { display:grid; grid-template-columns:190px 1fr; gap:10px 14px; align-items:center; }
.kv label { color:var(--muted); font-weight:600; }
pre { white-space:pre-wrap; background:var(--brand-soft); border:1px solid var(--brand-line); border-radius:14px; padding:12px 14px; margin:0;
      font:12.5px/1.5 ui-monospace,Consolas,monospace; }
.md h1 { font-size:20px; font-weight:800; } .md h2 { font-size:16px; font-weight:800; margin-top:18px; } .md table { margin:8px 0; } .md td, .md th { font-size:13px; }
.score { font-size:30px; font-weight:800; }
.warn { color:var(--warn); } .good { color:var(--go); }
.toast { position:fixed; bottom:20px; right:20px; background:var(--brand); color:var(--on-brand); padding:12px 18px; border-radius:16px; max-width:440px;
         z-index:30; box-shadow:var(--shadow); font-weight:600; }
@media (max-width:640px) { .kv { grid-template-columns:1fr; } th:nth-child(n+6), td:nth-child(n+6) { display:none; } }
</style>

function toast(msg, ms=3500) { const t=$("#toast"); t.textContent=msg; t.classList.remove("hide"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add("hide"), ms); }
async function api(path, body) {
  const opt = { headers: { "Content-Type": "application/json", "X-Token": localStorage.getItem("tb_token") || "" } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { const t = prompt("Access token for this TeamBid server:"); if (t) { localStorage.setItem("tb_token", t); return api(path, body); } }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function fileLink(p, label) { return p ? `<a href="/files?path=${encodeURIComponent(p)}&token=${encodeURIComponent(localStorage.getItem("tb_token")||"")}">${esc(label)}</a>` : ""; }
function md(src) {   // tiny markdown renderer: headers, lists, tables, bold, italics, links
  const out = []; let table = null, list = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>")
      .replace(/\[(.+?)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/(^|\s)(https?:\/\/\S+)/g,'$1<a href="$2" target="_blank">$2</a>');
  for (const line of src.split("\n")) {
    if (/^\|/.test(line)) { const cells=line.split("|").slice(1,-1).map(c=>c.trim()); if (cells.every(c=>/^-+$/.test(c))) continue;
      if (!table) { table=[]; out.push("__T"+out.length); } table.push(cells); continue; }
    if (table) { const i=out.findIndex(x=>x.startsWith("__T")); out[i]="<table>"+table.map((r,k)=>"<tr>"+r.map(c=>k?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")+"</tr>").join("")+"</table>"; table=null; }
    if (/^\s*[-*] /.test(line)) { if (!list) { out.push("<ul>"); list=true; } out.push("<li>"+inline(line.replace(/^\s*[-*] /,""))+"</li>"); continue; }
    if (list) { out.push("</ul>"); list=false; }
    const h=line.match(/^(#{1,3}) (.*)/); if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    out.push(line.trim() ? "<p>"+inline(line)+"</p>" : "");
  }
  if (table) { const i=out.findIndex(x=>x.startsWith("__T")); out[i]="<table>"+table.map((r,k)=>"<tr>"+r.map(c=>k?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")+"</tr>").join("")+"</table>"; }
  if (list) out.push("</ul>");
  return '<div class="md">'+out.join("\n")+"</div>";
}

    || `<div class="muted" style="padding:6px 12px">No members yet</div>`;
  const item = t => `<button class="navitem ${t === state.tab ? "on" : ""}" onclick="closeMenu();setTab('${t}')"><svg viewBox="0 0 24 24">${ICONS[t]}</svg>${t}</button>`;
  $("#nav-member").innerHTML = MEMBER_TABS.map(item).join("");

        <div class="card"><h2>Must-haves</h2><div class="good">You have: ${esc(f.have.join(", ")||"-")}</div><div class="bad">Missing: ${esc(f.missing.join(", ")||"-")}</div>
          <div class="muted">Nice-to-have you have: ${esc(f.nice_have.join(", ")||"-")}</div></div></div>
        <div class="card"><h2>Cover letter</h2><div>${fileLink(r.files.letter_pdf,"Letter PDF")} · ${fileLink(r.files.letter_docx,"DOCX")} ${r.polish?`<span class="muted">· ${esc(r.polish)}</span>`:""}</div>
          <textarea id="a_letter" rows="12">${esc(r.letter)}</textarea><pre id="a_lcheck">${esc(fmtCheck(r.letter_check))}</pre>
          <button class="b ghost" id="a_recheck">Re-check my edits</button></div>
        <div class="card"><h2>Application answers</h2>${Object.entries(r.answers).map(([q,a])=>`<p><b>${esc(q)}</b></p><pre>${esc(a.answer)}</pre>`).join("")}</div>
        <div class="card muted">Saved to ${esc(r.folder)} · tracked as application #${r.application_id} (Tracker tab).</div>`;
      $("#a_recheck").onclick = async () => { const c = await api("/api/check", { text: $("#a_letter").value }); $("#a_lcheck").textContent = c.report; };
    } catch(e) { $("#a_msg").textContent = ""; toast(e.message, 7000); }
  };
},
async "Tracker"(v) {
  if (needMember()) return;
  const rows = await api(`/api/member/${state.member}/applications`);
  const st = ["drafting","applied","interview","offer","rejected","withdrawn","closed"];
  const counts = st.map(s=>`${s} ${rows.filter(r=>r.status===s).length}`).join(" · ");
  v.innerHTML = `<div class="card"><h2>Pipeline</h2><div class="muted">${counts}</div></div><div class="card"><table><tr><th>#</th><th>Company</th><th>Role</th><th>Fit</th><th>Status</th><th>Updated</th><th>Folder</th></tr>
    ${rows.map(r=>`<tr><td>${r.id}</td><td>${esc(r.company)}</td><td>${r.url?`<a href="${esc(r.url)}" target="_blank">${esc(r.title)}</a>`:esc(r.title)}</td><td>${r.fit??""}%</td>
      <td><select onchange="astatus(${r.id},this.value)">${st.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${esc(r.updated)}</td><td class="muted">${esc((r.folder||"").split(/[\\/]/).pop())}</td></tr>`).join("")
    || '<tr><td colspan=7 class="muted">No applications yet. Use Apply.</td></tr>'}</table></div>`;
},
async "Vault"(v) {
  if (needMember()) return;
  const files = await api(`/api/member/${state.member}/vault`);
  const cur = state.vfile && files.includes(state.vfile) ? state.vfile : files[0];
  const f = cur ? await api(`/api/member/${state.member}/vault/${encodeURIComponent(cur)}`) : { text: "" };
  v.innerHTML = `<div class="card"><div class="row">${files.map(x=>`<button class="b ${x===cur?"":"ghost"}" onclick="state.vfile='${x}';render()">${esc(x.replace(/\.md$/,""))}</button>`).join("")}</div>
    <p class="muted">Folder: ${esc((f.path||"").replace(/[^\\/]+$/,""))}</p></div><div class="card">${cur?.startsWith("prompts/")?`<pre>${esc(f.text)}</pre>`:md(f.text)}</div>`;
},
async "Writing"(v) {
  v.innerHTML = `<div class="card"><h2>Writing checker</h2><p class="muted">Flags AI-style words, stock phrases, long sentences, even rhythm and hard reading. Paste an answer, letter or bullet.</p>
    <textarea id="w_text" rows="10"></textarea><div class="row"><label>Limit <input id="w_limit" type="number" style="width:90px"></label>
    <select id="w_kind"><option value="prose">Answer / letter</option><option value="bullet">Resume bullet</option></select><button class="b" id="w_go">Check</button></div>
    <pre id="w_out" style="margin-top:10px"></pre></div>`;
  $("#w_go").onclick = async () => { const r = await api("/api/check", { text: $("#w_text").value, limit: +$("#w_limit").value || null, kind: $("#w_kind").value }); $("#w_out").textContent = r.report; };
},
async "Scans"(v) {
  const o = await api("/api/overview"), log = await api("/api/scan/log");
  v.innerHTML = `<div class="card"><h2>Shared job scan</h2><p class="muted">One scan reads ~27,000 company job boards (Greenhouse, Ashby, Lever, Workday, SmartRecruiters, Workable, Recruitee, Breezy, BambooHR, iCIMS) plus remote-job feeds, then matches every member. A full scan takes about an hour and survives restarts and internet drops (it resumes).</p>
    <div class="row"><label>Posted within <input id="s_days" type="number" value="2" style="width:60px"> days</label><label>Test with first <input id="s_limit" type="number" placeholder="all" style="width:80px"> boards</label>
    <button class="b" id="s_go" ${log.running?"disabled":""}>${log.running?"Scan running...":"Start scan"}</button>
    ${log.running?'<button class="b ghost" id="s_stop">Stop scan</button>':""}</div>
    <div class="muted" style="margin-top:6px">Stopping keeps every finished board: starting again the same day resumes where it stopped. Members are matched when a scan finishes.</div>
    <pre style="margin-top:10px;max-height:260px;overflow:auto" id="s_log">${esc(log.lines.join("\n")||"No scan yet.")}</pre></div>
    <div class="card"><h2>History</h2><table><tr><th>Started</th><th>Minutes</th><th>Boards</th><th>Jobs</th><th>Problems</th></tr>
    ${o.runs.map(r=>`<tr><td>${esc(r.started)}</td><td>${r.secs?(r.secs/60).toFixed(1):"running"}</td><td>${(r.stats.boards||0).toLocaleString()}</td><td>${(r.stats.jobs||0).toLocaleString()}</td><td class="muted">${esc((r.stats.problems||[]).join("; ")||"-")}</td></tr>`).join("")||'<tr><td colspan=5 class="muted">No scans yet.</td></tr>'}</table></div>
    <div class="card muted">Daily schedule: run <code>python tb.py schedule</code> once (Windows). It checks hourly and scans once a day after the configured hour.</div>`;
  if (log.running) $("#s_stop").onclick = async () => {
    if (!confirm("Stop the running scan? Finished boards are kept; the next scan today resumes from there.")) return;
    const r = await api("/api/scan/stop", {}); toast(r.stopped ? "Scan stopped. Progress kept." : r.reason); setTimeout(render, 800);
  };
  $("#s_go").onclick = async () => { const r = await api("/api/scan", { days: +$("#s_days").value || 2, limit: +$("#s_limit").value || null }); toast(r.message || (r.started ? "Scan started in the background." : r.reason)); setTimeout(render, 1500); };
  if (log.running) { clearTimeout(state.poll); state.poll = setTimeout(() => state.tab==="Scans" && render(), 8000); }
},
async "Knowledge"(v) {
  const files = await api("/api/knowledge");
  const cur = state.kfile && files.includes(state.kfile) ? state.kfile : "README.md";
  const f = await api(`/api/knowledge/${cur}`);
  v.innerHTML = `<div class="card"><div class="row">${files.map(x=>`<button class="b ${x===cur?"":"ghost"}" onclick="state.kfile='${x}';render()">${esc(x.replace(/\.md$/,""))}</button>`).join("")}</div></div><div class="card">${md(f.text)}</div>`;
},
};
function fmtCheck(c) { const s=c.stats; const flags=[...c.fails.map(x=>"FAIL: "+x), ...c.warnings.map(x=>"WARNING: "+x)];
  return `${s.chars} chars, ${s.words} words, reading ease ${s.reading_ease}, grade ${s.grade}\n` + (flags.join("\n") || "OK: no flags"); }
async function mstatus(job, status) { await api(`/api/member/${state.member}/match/${job}`, { status }); toast(`Marked ${status}`); render(); }
async function astatus(id, status) { await api(`/api/application/${id}`, { status }); toast(`Application #${id}: ${status}`); }
loadMembers().then(render).catch(e => { $("#view").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
